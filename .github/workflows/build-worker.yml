name: 自动构建 _worker.js

on:
  push:
    branches: [ main ]
    paths:
      - 'worker/src/**'
      - 'worker/package.json'
      - '.github/workflows/build-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖并构建
        run: |
          cd worker
          npm install
          npm run build
          cp dist/worker.js ../_worker.js

      - name: 提交 _worker.js 回仓库
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          if git diff --staged --quiet; then
            echo "产物无变化，跳过提交"
            exit 0
          fi
          # 这里不能加 [skip ci]：Cloudflare Pages 认这个标记，会把整次部署标记成
          # is_skipped 而跳过。而改 src 的那次提交触发的部署跑在重打包之前（此时
          # 仓库里的 _worker.js 还是旧的），于是新产物永远上不了线。
          # 本 job 有 paths: worker/src/** 过滤，回写 _worker.js 不会自触发死循环；
          # ci.yml 没加过滤，会多跑一次只读测试，无害。
          git commit -m "build: 自动更新 _worker.js (Pages 产物)"
          git push
