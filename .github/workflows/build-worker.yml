name: 自动构建 _worker.js

on:
  push:
    branches: [ main ]
    paths:
      - 'worker/src/**'
      - 'worker/package.json'
      - '.github/workflows/build-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖并构建
        run: |
          cd worker
          npm install
          npm run build
          cp dist/worker.js ../_worker.js

      - name: 提交 _worker.js 回仓库
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          if git diff --staged --quiet; then
            echo "产物无变化，跳过提交"
            exit 0
          fi
          git commit -m "build: 自动更新 _worker.js (Pages 产物) [skip ci]"
          git push
